<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Tracker</title><style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#172033}.top{background:#172033;color:#fff;padding:24px}.wrap{max-width:1050px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:18px}.metric strong{display:block;font-size:24px;margin-top:8px}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}button.alt{background:#e8eef7;color:#172033}input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0f5}.actions{display:flex;gap:8px;justify-content:flex-end}dialog{border:0;border-radius:14px;padding:22px;width:min(92vw,430px)}dialog::backdrop{background:#0006}</style></head><body><header class="top"><h1>Personal Finance Tracker</h1><p>Income, expenses, accounts and credit cards</p></header><main class="wrap"><section id="auth" class="panel"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button> <button id="signup" class="alt">Create account</button><p id="authmsg"></p></section><section id="app" class="hidden"><button id="logout" class="alt">Log out</button><div class="tabs"><button data-tab="overview">Overview</button><button data-tab="transactions">Transactions</button><button data-tab="accounts">Accounts</button><button data-tab="cards">Credit cards</button></div><div id="overview" class="tab"><div class="grid"><div class="metric">Total balance<strong id="balance">Rs 0</strong></div><div class="metric">Card outstanding<strong id="outstanding">Rs 0</strong></div><div class="metric">Monthly income<strong id="income">Rs 0</strong></div><div class="metric">Monthly expenses<strong id="expenses">Rs 0</strong></div></div><div class="panel"><button id="add1">Add transaction</button><div id="recent"></div></div></div><div id="transactions" class="tab hidden"><div class="panel"><button id="add2">Add transaction</button><div id="all"></div></div></div><div id="accounts" class="tab hidden"><div class="panel"><button id="addAccount">Add account</button><div id="accountList"></div></div></div><div id="cards" class="tab hidden"><div class="panel"><button id="addCard">Add card</button><div id="cardList"></div></div></div></section></main><dialog id="txDialog"><form id="txForm"><h2>Add transaction</h2><select id="type"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option><option value="card_payment">Credit card payment</option></select><input id="date" type="date" required><input id="desc" placeholder="Description" required><input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input id="category" placeholder="Category"><select id="account"></select><select id="destination"></select><textarea id="note" placeholder="Note"></textarea><div class="actions"><button type="button" class="alt" onclick="txDialog.close()">Cancel</button><button>Save</button></div><p id="txmsg"></p></form></dialog><dialog id="accountDialog"><form id="accountForm"><h2>Add account</h2><input id="aname" placeholder="Account name" required><select id="atype"><option>bank</option><option>cash</option><option>wallet</option></select><input id="opening" type="number" step="0.01" placeholder="Opening balance" required><div class="actions"><button type="button" class="alt" onclick="accountDialog.close()">Cancel</button><button>Save</button></div></form></dialog><dialog id="cardDialog"><form id="cardForm"><h2>Add credit card</h2><input id="cname" placeholder="Card name" required><input id="limit" type="number" step="0.01" placeholder="Credit limit" required><input id="openingCard" type="number" step="0.01" placeholder="Opening outstanding" required><input id="due" type="date"><div class="actions"><button type="button" class="alt" onclick="cardDialog.close()">Cancel</button><button>Save</button></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user,accounts=[],cards=[],tx=[];const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('en-LK',{style:'currency',currency:'LKR'}).format(Number(n)||0),today=()=>new Date().toISOString().slice(0,10);function table(rows){return '<table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Type</th></tr></thead><tbody>'+rows+'</tbody></table>'}async function load(){accounts=(await db.from('accounts').select('*').order('created_at',{ascending:false})).data||[];cards=(await db.from('credit_cards').select('*').order('created_at',{ascending:false})).data||[];tx=(await db.from('transactions').select('*').order('date',{ascending:false})).data||[];render()}function ab(a){return +a.opening_balance+tx.filter(t=>t.account_id===a.id&&t.type==='income').reduce((s,t)=>s+ +t.amount,0)-tx.filter(t=>t.account_id===a.id&&t.type==='expense').reduce((s,t)=>s+ +t.amount,0)-tx.filter(t=>t.account_id===a.id&&['transfer','card_payment'].includes(t.type)).reduce((s,t)=>s+ +t.amount,0)+tx.filter(t=>t.to_account_id===a.id).reduce((s,t)=>s+ +t.amount,0)}function co(c){return +c.opening_outstanding+tx.filter(t=>t.to_card_id===c.id&&t.type==='expense').reduce((s,t)=>s+ +t.amount,0)-tx.filter(t=>t.to_card_id===c.id&&t.type==='card_payment').reduce((s,t)=>s+ +t.amount,0)}function render(){let m=today().slice(0,7);$('balance').textContent=money(accounts.reduce((s,a)=>s+ab(a),0));$('outstanding').textContent=money(cards.reduce((s,c)=>s+co(c),0));$('income').textContent=money(tx.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+ +t.amount,0));$('expenses').textContent=money(tx.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+ +t.amount,0));let rows=tx.map(t=>`<tr><td>${t.date}</td><td>${t.description}</td><td>${t.category||''}</td><td>${money(t.amount)}</td><td>${t.type}</td></tr>`).join('');$('all').innerHTML=table(rows);$('recent').innerHTML=table(tx.slice(0,8).map(t=>`<tr><td>${t.date}</td><td>${t.description}</td><td>${t.category||''}</td><td>${money(t.amount)}</td><td>${t.type}</td></tr>`).join(''));$('accountList').innerHTML=accounts.map(a=>`<div class="panel"><b>${a.name}</b><p>${a.type}</p><h2>${money(ab(a))}</h2></div>`).join('');$('cardList').innerHTML=cards.map(c=>`<div class="panel"><b>${c.name}</b><p>Limit: ${money(c.credit_limit)}</p><h2>${money(co(c))}</h2><p>Due: ${c.due_date||'Not set'}</p></div>`).join('');$('account').innerHTML=accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');$('destination').innerHTML='<option value="">No destination</option>'+accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')+cards.map(c=>`<option value="card:${c.id}">${c.name} card</option>`).join('')}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('hidden',t.id!==b.dataset.tab))});$('login').onclick=async()=>{let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authmsg').textContent=r.error?.message||''};$('signup').onclick=async()=>{let r=await db.auth.signUp({email:$('email').value,password:$('password').value});$('authmsg').textContent=r.error?.message||'Account created. Check your email.'};$('logout').onclick=()=>db.auth.signOut();db.auth.onAuthStateChange((e,s)=>{user=s?.user;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user)load()});$('add1').onclick=$('add2').onclick=()=>{$('date').value=today();$('txDialog').showModal()};$('addAccount').onclick=()=>$('accountDialog').showModal();$('addCard').onclick=()=>$('cardDialog').showModal();$('type').onchange=()=>$('destination').disabled=!['transfer','card_payment'].includes($('type').value);$('txForm').onsubmit=async e=>{e.preventDefault();let d=$('destination').value,r={user_id:user.id,type:$('type').value,date:$('date').value,description:$('desc').value,amount:+$('amount').value,category:$('category').value,note:$('note').value,account_id:$('account').value,to_account_id:d&&!d.startsWith('card:')?d:null,to_card_id:d.startsWith('card:')?d.slice(5):null};let x=await db.from('transactions').insert(r);if(x.error)$('txmsg').textContent=x.error.message;else{$('txDialog').close();$('txForm').reset();load()}};$('accountForm').onsubmit=async e=>{e.preventDefault();let x=await db.from('accounts').insert({user_id:user.id,name:$('aname').value,type:$('atype').value,opening_balance:+$('opening').value});if(x.error)alert(x.error.message);else{$('accountDialog').close();$('accountForm').reset();load()}};$('cardForm').onsubmit=async e=>{e.preventDefault();let x=await db.from('credit_cards').insert({user_id:user.id,name:$('cname').value,credit_limit:+$('limit').value,opening_outstanding:+$('openingCard').value,due_date:$('due').value||null});if(x.error)alert(x.error.message);else{$('cardDialog').close();$('cardForm').reset();load()}};</script></body></html>
